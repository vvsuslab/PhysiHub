<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luyện đề — PhysiHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css">
  <link rel="stylesheet" href="assets/lively.css">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2e4a86">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PhysiHub">
  <style>
    /* Danh sách đề */
    .exam-card { display: flex; flex-direction: column; gap: 6px; }
    .exam-card .t { font-family: var(--font-serif); font-size: 21px; font-weight: 600; }
    .exam-card .t-en { font-family: var(--font-serif); font-style: italic; color: var(--gold); }
    .exam-card .meta { font-size: 13px; color: var(--ink-3); }
    .exam-card .foot { margin-top: auto; padding-top: 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    /* Làm bài */
    .exam-top { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-bottom: 20px; }
    .exam-top .t { font-weight: 600; }
    .exam-top .meta { font-size: 13px; color: var(--ink-3); }
    .exam-top .exit { margin-left: auto; }
    .layout { display: grid; grid-template-columns: 1fr 300px; gap: 24px; align-items: start; }
    .qcard { scroll-margin-top: 84px; }
    .qcard + .qcard { margin-top: 16px; }
    .qhead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--ink-3); margin-bottom: 8px; }
    .qhead b { color: var(--navy); }
    .stem { font-size: 17px; line-height: 1.6; margin-bottom: 14px; }
    .stem .bi .en { margin-top: 6px; }
    .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); line-height: 1.45; }
    .opt:hover { border-color: var(--navy); }
    .opt .k { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line-strong); display: grid; place-items: center; font-size: 12px; font-weight: 600; }
    .opt.selected { border-color: var(--navy); background: var(--navy-soft); }
    .opt.selected .k { background: var(--navy); border-color: var(--navy); color: #fff; }
    .opt.right { border-color: var(--green); background: var(--green-soft); }
    .opt.wrong { border-color: var(--red); background: var(--red-soft); }
    .opt .bi .en { margin-top: 2px; }
    .tf { display: flex; gap: 14px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); }
    .tf + .tf { margin-top: 10px; }
    .tf .k { flex: none; font-weight: 600; color: var(--ink-2); width: 20px; }
    .tf .txt { flex: 1; line-height: 1.5; }
    .tf .sw { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; flex: none; }
    .tf .sw button { padding: 7px 14px; font-size: 13px; font-weight: 500; background: var(--surface); }
    .tf .sw button.on { background: var(--navy); color: #fff; }
    .tf .sw button.on.f { background: var(--gold); }
    .tf.right { border-color: var(--green); background: var(--green-soft); }
    .tf.wrong { border-color: var(--red); background: var(--red-soft); }
    .short { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .short .box { display: inline-flex; align-items: center; border: 1px solid var(--navy); border-radius: 9px; overflow: hidden; background: var(--surface); }
    .short input { width: 110px; padding: 10px 14px; border: 0; outline: 0; font-family: var(--font-serif); font-size: 26px; text-align: center; background: transparent; }
    .short .unit { padding: 0 12px; font-size: 13px; color: var(--ink-3); border-left: 1px solid var(--line); align-self: stretch; display: flex; align-items: center; }
    .short .note { font-size: 13px; color: var(--ink-3); }
    .short.right .box { border-color: var(--green); background: var(--green-soft); }
    .short.wrong .box { border-color: var(--red); background: var(--red-soft); }
    .why { display: none; margin-top: 14px; padding: 12px 14px; border-radius: 8px; background: var(--surface-2); font-size: 14px; line-height: 1.6; }
    .why.show { display: block; }
    .why .lbl { font-size: 12px; color: var(--ink-3); margin-bottom: 4px; }
    .side { position: sticky; top: calc(var(--header-h) + 16px); display: flex; flex-direction: column; gap: 14px; }
    .timer { text-align: center; }
    .timer .lbl { font-size: 13px; color: var(--ink-3); }
    .timer .val { font-family: var(--font-serif); font-size: 40px; font-weight: 500; letter-spacing: .02em; }
    .timer .val.low { color: var(--red); }
    .navp { font-size: 13px; }
    .navp .grp { font-weight: 600; color: var(--ink-2); margin: 10px 0 6px; }
    .navp .grp:first-child { margin-top: 0; }
    .nums { display: flex; flex-wrap: wrap; gap: 6px; }
    .nums button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); font-size: 13px; font-weight: 500; }
    .nums button.done { background: var(--navy); border-color: var(--navy); color: #fff; }
    .nums button.cur { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold-soft); }
    .nums button.ok { background: var(--green); border-color: var(--green); color: #fff; }
    .nums button.bad { background: var(--red); border-color: var(--red); color: #fff; }
    .legend { display: flex; flex-direction: column; gap: 4px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-2); }
    .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--line-strong); margin-right: 8px; vertical-align: -1px; }
    .result { border-left: 4px solid var(--navy); margin-bottom: 20px; display: grid; grid-template-columns: auto 1fr; gap: 6px 28px; align-items: center; }
    .result .score { font-family: var(--font-serif); font-size: 48px; font-weight: 600; color: var(--navy); grid-row: span 2; }
    .result .l { font-size: 13px; color: var(--ink-3); }
    .autosave { font-size: 13px; color: var(--ink-3); margin-top: 14px; }
    @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } .side { position: static; order: -1; } .opts { grid-template-columns: 1fr; } .tf { flex-wrap: wrap; } .result { grid-template-columns: 1fr; } .result .score { grid-row: auto; } }
  </style>
</head>
<body>
  <main>
    <div class="wrap" id="app"></div>
  </main>

  <script src="data/lessons.js"></script>
  <script src="data/terms.js"></script>
  <script src="data/exams.js"></script>
  <script src="assets/site.js"></script>
  <script>
    const examId = PH.qs('exam');
    PH.mount({ active: 'exams', noFooter: !!examId });
    const app = document.getElementById('app');
    const EXAMS = PH.EXAMS || [];

    /* =============== DANH SÁCH ĐỀ =============== */
    function renderList() {
      const p = PH.progress();
      const attempts = Object.values(p.exams).reduce((s, x) => s + (x.attempts || 0), 0);
      app.innerHTML = `<div class="page-hero"><div><span class="badge">Luyện đề</span><h1>Đề ôn theo cấu trúc đề thi 2025</h1>
        <p>Ba dạng câu hỏi như đề thi tốt nghiệp THPT: nhiều phương án lựa chọn, đúng/sai, trả lời ngắn. Câu hỏi có cả tiếng Việt và tiếng Anh; đổi mức ngôn ngữ không làm thay đổi điểm.</p></div>
        <span class="spacer"></span><div class="glass" style="padding:14px 18px;min-width:170px"><div class="small" style="color:#cfe0ff">Số lần làm đề</div><div style="font-family:var(--font-serif);font-size:32px;line-height:1.1">${attempts}</div></div></div>
        <div class="grid c2">${EXAMS.map(x => {
          const count = x.parts.reduce((s, pt) => s + pt.items.length, 0);
          const best = p.exams[x.id] && p.exams[x.id].best;
          const draft = p.exams[x.id] && p.exams[x.id].draft && p.exams[x.id].draft.endTime > Date.now();
          return `<div class="card exam-card topbar lift acc-${x.chapter}" style="padding-top:26px"><div class="row" style="justify-content:space-between"><span class="tag acc">Chương ${PH.roman(x.chapter)}</span><span class="icon-tile sm tone-${x.chapter}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h6l1 2h3v13H5V7h3z"/><path d="m9 13 2 2 4-4"/></svg></span></div>
            <span class="t">${PH.esc(x.title.vi)}</span><span class="t-en">${PH.esc(x.title.en)}</span>
            <span class="meta">${count} câu · ${x.minutes} phút · ${x.parts.map(pt => ({ mcq: 'nhiều lựa chọn', tf: 'đúng/sai', short: 'trả lời ngắn' }[pt.kind] + ' ' + pt.items.length)).join(' · ')}</span>
            <div class="foot"><span class="small muted">${best != null ? `Điểm cao nhất: <b style="color:var(--navy)">${PH.num(best, 2)}/10</b>` : 'Chưa làm'}${draft ? ' · <span class="tag gold">đang làm dở</span>' : ''}</span>
            <a class="btn accent" href="luyende.html?exam=${x.id}">${draft ? 'Làm tiếp' : 'Làm đề'}</a></div></div>`;
        }).join('') || '<div class="empty">Chưa có đề nào.</div>'}</div>`;
    }

    /* =============== LÀM BÀI =============== */
    const exam = EXAMS.find(x => x.id === examId);
    let state = null, timerId = null, submitted = false, current = null;
    const flat = [];        // danh sách câu theo thứ tự hiển thị
    if (exam) exam.parts.forEach(pt => pt.items.forEach((it, i) => flat.push({ part: pt, item: it, idx: i })));

    function loadState() {
      const p = PH.progress(); const d = p.exams[exam.id] && p.exams[exam.id].draft;
      if (d && d.endTime > Date.now()) return d;
      return { answers: {}, endTime: Date.now() + exam.minutes * 60000, startedAt: Date.now() };
    }
    const saveDraft = () => PH.update(p => { p.exams[exam.id] = Object.assign({}, p.exams[exam.id], { draft: state }); });
    const clearDraft = () => PH.update(p => { if (p.exams[exam.id]) delete p.exams[exam.id].draft; });

    const partLabel = { mcq: 'Trắc nghiệm nhiều lựa chọn', tf: 'Trắc nghiệm đúng/sai', short: 'Trắc nghiệm trả lời ngắn' };
    const partRoman = { mcq: 'I', tf: 'II', short: 'III' };
    const tfPoints = n => [0, 0.1, 0.25, 0.5, 1][n] || 0;

    function isDone(f) {
      const a = state.answers[f.item.id];
      if (f.part.kind === 'mcq') return a != null;
      if (f.part.kind === 'tf') return Array.isArray(a) && a.length === 4 && a.every(v => v === true || v === false);
      return a != null && String(a).trim() !== '';
    }
    function grade(f) {
      const a = state.answers[f.item.id]; const it = f.item;
      if (f.part.kind === 'mcq') return { pts: a === it.correct ? f.part.points : 0, max: f.part.points, ok: a === it.correct };
      if (f.part.kind === 'tf') { const n = it.statements.filter((s, i) => a && a[i] === s.answer).length; return { pts: tfPoints(n), max: 1, ok: n === 4, n }; }
      const v = PH.parseNum(a); const ok = !isNaN(v) && Math.abs(v - it.answer) <= (it.tolerance != null ? it.tolerance : 1e-6);
      return { pts: ok ? f.part.points : 0, max: f.part.points, ok };
    }

    function qHTML(f, n) {
      const it = f.item, kind = f.part.kind, a = state.answers[it.id], g = submitted ? grade(f) : null;
      const pts = kind === 'tf' ? '1 ý 0,1 – 2 ý 0,25 – 3 ý 0,5 – 4 ý 1,0 điểm' : `${PH.num(f.part.points)} điểm`;
      let body = '';
      if (kind === 'mcq') {
        body = `<div class="opts">${it.options.map((o, i) => {
          let cls = a === i ? ' selected' : '';
          if (submitted) { if (i === it.correct) cls = ' right'; else if (a === i) cls = ' wrong'; }
          return `<button type="button" class="opt${cls}" data-mcq="${it.id}" data-i="${i}" ${submitted ? 'disabled' : ''}><span class="k">${'ABCD'[i]}</span><span>${PH.L(o)}</span></button>`;
        }).join('')}</div>`;
      } else if (kind === 'tf') {
        body = it.statements.map((s, i) => {
          const v = a ? a[i] : null; let cls = '';
          if (submitted) cls = v === s.answer ? ' right' : ' wrong';
          return `<div class="tf${cls}"><span class="k">${'abcd'[i]})</span><span class="txt">${PH.L(s)}</span>
            <span class="sw"><button type="button" class="${v === true ? 'on' : ''}" data-tf="${it.id}" data-i="${i}" data-v="1" ${submitted ? 'disabled' : ''}>Đúng</button><button type="button" class="${v === false ? 'on f' : ''}" data-tf="${it.id}" data-i="${i}" data-v="0" ${submitted ? 'disabled' : ''}>Sai</button></span>
            ${submitted ? `<span class="tag ${s.answer ? 'green' : 'gold'}">${s.answer ? 'Đúng' : 'Sai'}</span>` : ''}</div>`;
        }).join('');
      } else {
        body = `<div class="short${submitted ? (g.ok ? ' right' : ' wrong') : ''}"><span class="box"><input type="text" inputmode="decimal" maxlength="5" value="${PH.esc(a || '')}" data-short="${it.id}" placeholder="?" ${submitted ? 'disabled' : ''}><span class="unit">${PH.esc(it.unit || '')}</span></span>
          <span class="note">Nhập số nguyên hoặc số thập phân, dùng dấu phẩy. Tối đa 4 kí tự.${submitted ? ` Đáp án: <b>${PH.num(it.answer)}</b>` : ''}</span></div>`;
      }
      const why = it.why || it.solution;
      return `<div class="card qcard part-${partRoman[kind]}" id="q-${it.id}" data-n="${n}">
        <div class="qhead"><b>Phần ${partRoman[kind]} · Câu ${f.idx + 1}</b><span>${partLabel[kind]} · ${pts}</span>${it.lesson ? `<a class="small" href="bai.html?n=${it.lesson}" style="margin-left:auto">Bài ${it.lesson}</a>` : ''}</div>
        <div class="stem hl">${PH.L(kind === 'tf' ? it.stem : it.q)}</div>${body}
        <div class="why${submitted ? ' show' : ''}"><div class="lbl">${kind === 'short' ? 'Lời giải' : 'Giải thích'}</div>${PH.L(why)}</div></div>`;
    }

    function navHTML() {
      const groups = exam.parts.map(pt => {
        const btns = pt.items.map((it, i) => {
          const f = flat.find(x => x.item.id === it.id); let cls = '';
          if (submitted) cls = grade(f).ok ? 'ok' : 'bad'; else if (isDone(f)) cls = 'done';
          if (current === it.id) cls += ' cur';
          return `<button type="button" class="${cls}" data-go="${it.id}">${i + 1}</button>`;
        }).join('');
        return `<div class="grp">Phần ${partRoman[pt.kind]} · ${partLabel[pt.kind].replace('Trắc nghiệm ', '')}</div><div class="nums">${btns}</div>`;
      }).join('');
      return `<div class="card navp">${groups}<div class="legend"><span><i style="background:var(--navy);border-color:var(--navy)"></i>đã làm</span><span><i style="border-color:var(--gold)"></i>đang xem</span><span><i></i>chưa làm</span></div></div>`;
    }

    function renderExam() {
      const done = flat.filter(isDone).length;
      app.innerHTML = `<div class="exam-top"><span class="icon-tile tone-${exam.chapter}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h6l1 2h3v13H5V7h3z"/><path d="m9 13 2 2 4-4"/></svg></span><div><div class="t">${PH.esc(exam.title.vi)}</div><div class="meta">${flat.length} câu · ${exam.minutes} phút · cấu trúc đề thi 2025</div></div><a class="exit btn outline sm" href="luyende.html">Thoát</a></div>
        <div id="resultBox"></div>
        <div class="layout"><div id="qs">${flat.map((f, i) => qHTML(f, i)).join('')}<p class="autosave">Bài làm được lưu tự động sau mỗi câu. Nếu mất mạng, em mở lại trang là làm tiếp được.</p></div>
        <aside class="side"><div class="card timer"><div class="lbl">Thời gian còn lại</div><div class="val" id="timer">--:--</div></div><div id="nav">${navHTML()}</div>
          <div class="notice">Đổi mức ngôn ngữ không làm thay đổi điểm bài thi. Hệ số theo mức ngôn ngữ chỉ áp dụng trong phần Trò chơi.</div>
          <button class="btn block" id="btnSubmit" ${submitted ? 'disabled' : ''}>${submitted ? 'Đã nộp bài' : `Nộp bài (${done}/${flat.length} câu)`}</button></aside></div>`;
      PH.highlight(document.getElementById('qs'));
      if (submitted) renderResult();
      tick();
      observe();
    }
    function refreshNav() {
      document.getElementById('nav').innerHTML = navHTML();
      const done = flat.filter(isDone).length; const b = document.getElementById('btnSubmit'); if (!submitted) b.textContent = `Nộp bài (${done}/${flat.length} câu)`;
    }
    function observe() {
      const io = new IntersectionObserver(entries => { entries.forEach(e => { if (e.isIntersecting) { current = e.target.id.slice(2); document.querySelectorAll('.nums button').forEach(b => b.classList.toggle('cur', b.dataset.go === current)); } }); }, { rootMargin: '-40% 0px -55% 0px' });
      document.querySelectorAll('.qcard').forEach(c => io.observe(c));
    }

    function tick() {
      if (!state || submitted) return;
      const left = Math.max(0, Math.ceil((state.endTime - Date.now()) / 1000));
      const el = document.getElementById('timer'); if (el) { el.textContent = PH.mmss(left); el.classList.toggle('low', left < 120); }
      if (left === 0) { submit(true); }
    }

    function submit(auto) {
      if (submitted) return;
      submitted = true; clearInterval(timerId);
      let raw = 0, max = 0, ok = 0;
      flat.forEach(f => { const g = grade(f); raw += g.pts; max += g.max; if (g.ok) ok++; });
      const score = max ? raw / max * 10 : 0;
      const spent = Math.min(exam.minutes * 60, Math.round((Date.now() - state.startedAt) / 1000));
      state.result = { score, raw, max, ok, spent, at: Date.now() };
      PH.update(p => { const x = p.exams[exam.id] || {}; delete x.draft; x.last = state.result; x.best = Math.max(x.best || 0, score); x.attempts = (x.attempts || 0) + 1; p.exams[exam.id] = x; });
      renderExam(); window.scrollTo({ top: 0, behavior: 'smooth' });
      if (auto) PH.toast('Hết giờ — bài đã được nộp tự động.', 3000);
    }
    function renderResult() {
      const r = state.result; if (!r) return;
      document.getElementById('resultBox').innerHTML = `<div class="card result"><div class="score">${PH.num(r.score, 2)}<span style="font-size:20px;color:var(--ink-3)"> / 10</span></div>
        <div><div class="l">Kết quả</div><div>Đúng trọn vẹn <b>${r.ok}/${flat.length}</b> câu · ${PH.num(r.raw, 2)}/${PH.num(r.max, 2)} điểm thô · thời gian ${Math.floor(r.spent / 60)} phút ${r.spent % 60} giây</div></div>
        <div class="row"><button class="btn outline sm" id="btnRetry">Làm lại đề này</button><a class="btn ghost sm" href="luyende.html">Về danh sách đề</a></div></div>`;
      document.getElementById('btnRetry').addEventListener('click', () => { clearDraft(); state = null; submitted = false; start(); window.scrollTo(0, 0); });
    }

    function start() {
      state = loadState(); saveDraft(); renderExam();
      clearInterval(timerId); timerId = setInterval(tick, 500);
    }

    if (exam) {
      start();
      app.addEventListener('click', e => {
        const go = e.target.closest('[data-go]'); if (go) { document.getElementById('q-' + go.dataset.go).scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
        if (submitted) return;
        const m = e.target.closest('[data-mcq]'); if (m) { state.answers[m.dataset.mcq] = +m.dataset.i; saveDraft(); m.parentElement.querySelectorAll('.opt').forEach(o => o.classList.toggle('selected', o === m)); refreshNav(); return; }
        const t = e.target.closest('[data-tf]'); if (t) {
          const arr = state.answers[t.dataset.tf] || [null, null, null, null]; arr[+t.dataset.i] = t.dataset.v === '1'; state.answers[t.dataset.tf] = arr; saveDraft();
          const sw = t.parentElement; sw.children[0].className = arr[+t.dataset.i] === true ? 'on' : ''; sw.children[1].className = arr[+t.dataset.i] === false ? 'on f' : ''; refreshNav(); return;
        }
        if (e.target.id === 'btnSubmit') {
          const done = flat.filter(isDone).length;
          if (confirm(done < flat.length ? `Em còn ${flat.length - done} câu chưa làm. Nộp bài ngay?` : 'Nộp bài và xem kết quả?')) submit(false);
        }
      });
      app.addEventListener('input', e => { const s = e.target.closest('[data-short]'); if (s && !submitted) { s.value = s.value.replace(/[^0-9.,\-]/g, '').slice(0, 5); state.answers[s.dataset.short] = s.value; saveDraft(); refreshNav(); } });
      PH.onLang(() => { const y = window.scrollY; renderExam(); window.scrollTo(0, y); });
    } else {
      renderList(); PH.onLang(renderList);
    }
  </script>
</body>
</html>
