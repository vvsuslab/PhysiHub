    @media (max-width: 1080px) { .tn-stage .grid3 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .tn-stage .grid3 > :last-child { grid-column: 1 / -1; } }

    @media (max-width: 720px) { .tn-stage { padding: 12px; border-radius: 20px; } .tn-stage .grid3 { grid-template-columns: 1fr; } .controls { padding: 14px 16px; gap: 12px; } .tn-nut { flex: 1; justify-content: center; min-width: 0; } .readout { flex-wrap: wrap; } .readout .t { font-size: 24px; }

  <script>
    Object.assign(PH.UI, {

      lbMau: ['Màu phân tử cho biết tốc độ chuyển động trung bình', 'Colour shows the average speed of the molecules'], cham: ['chậm', 'slow'], nhanh: ['nhanh', 'fast'],

      $('thay').innerHTML = `${PH.label('eye', PH.uiFmt('lbThay'))}<p>${PH.uiFmt('thay1')}</p>${bi ? `<p class="en" lang="en">${PH.esc(PH.dinh(PH.UI.thay1[1]))}</p>` : ''}<p>${PH.uiFmt('thay2')}</p>${bi ? `<p class="en" lang="en">${PH.esc(PH.dinh(PH.UI.thay2[1]))}</p>` : ''}<p class="hoi">${PH.icon('star', 'sm')}${PH.uiFmt('hoi')}</p>`;
      const terms = TN_IDS.map(id => PH.termById(id)).filter(Boolean);
      const chips = terms.map(t => `<button type="button" class="tag term-chip" data-term="${t.id}">${PH.esc(en() ? t.en : t.vi)}${en() ? '' : ` <span class="en" lang="en">· ${PH.esc(t.en)}</span>`}</button>`).join('')
        + TN_STATIC.map(t => `<span class="tag">${PH.esc(en() ? t[1] : t[0])}${en() ? '' : ` <span class="en" lang="en">· ${PH.esc(t[1])}</span>`}</span>`).join('');
      $('tnTn').innerHTML = `${PH.label('book', PH.uiFmt('lbTnTn'), 'orange', 'sm')}<div class="chips">${chips}</div>`;
      $('day').innerHTML = `<p class="lb">${PH.uiFmt('lbDayLaGi')}</p><p>${PH.uiFmt('dayLaGi')}</p>`;
      lastPha = -1; update();
    }
    $('tnTn').addEventListener('click', e => { const b = e.target.closest('[data-term]'); if (b) PH.showTerm(b.dataset.term, b); });

    /* ---------- điều khiển ---------- */
    // Nhịp chạy: 30 lần/giây cho mượt, nhưng mỗi bước tính theo THỜI GIAN THẬT đã trôi qua,
    // nên tốc độ đun như nhau trên máy nhanh lẫn máy chậm.
    // Dùng setInterval chứ không dùng requestAnimationFrame: một số trình duyệt trong ứng dụng
    // (Facebook, Zalo, trình duyệt nhúng) không chạy requestAnimationFrame và thí nghiệm sẽ đứng im.
    const TOC_GOC = 3.75;  // đơn vị tiến trình mỗi giây ở mức ×1 (bằng đúng nhịp cũ)
    function buoc() {
      const now = performance.now();
      if (!chay) { moc = now; return; }
      const dt = Math.min(.12, (now - moc) / 1000); moc = now;   // chặn bước nhảy khi quay lại tab
      p = Math.min(100, p + TOC_GOC * toc * dt);
      if (p >= 100) { p = 100; chay = false; }
      update();
    }
    $('btnDun').addEventListener('click', () => { if (chay) chay = false; else { if (p >= 100) p = 0; chay = true; } update(); });
    $('btnLai').addEventListener('click', () => { chay = false; p = 0; update(); });
    $('tua').addEventListener('input', e => { p = +e.target.value; chay = false; update(); });
    document.querySelectorAll('[data-toc]').forEach(b => b.addEventListener('click', () => {
      toc = +b.dataset.toc;
      document.querySelectorAll('[data-toc]').forEach(x => { const on = x === b; x.classList.toggle('on', on); x.setAttribute('aria-pressed', on); });
    }));

    buildApparatus(); buildGraph(); buildMolecules(); renderText();
    moc = performance.now();
    timer = setInterval(buoc, 33);
    document.addEventListener('visibilitychange', () => { if (document.hidden) chay = false; });
    PH.onLang(renderText);
  </script>
</body>
</html>
