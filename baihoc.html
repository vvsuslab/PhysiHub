<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài học · PhysiHub</title>
  <meta name="description" content="Danh sách bài học Vật lí 12 song ngữ Việt – Anh theo bốn chương của SGK Kết nối tri thức với cuộc sống.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Bài học · PhysiHub">
  <meta property="og:image" content="https://vvsuslab.github.io/PhysiHub/assets/og-physihub.jpg">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Charis+SIL:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css">
  <link rel="stylesheet" href="assets/lively.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0D47A1">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PhysiHub">
  <style>
    .stat { padding: 14px 18px; min-width: 210px; border-radius: 18px; background: var(--orange-soft); border: 1.5px solid var(--orange-line); color: var(--ink); }
    .stat .lb { font-size: 15px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--gold); }
    .stat .n { font-family: var(--font-display); font-size: 30px; font-weight: 800; line-height: 1.15; color: var(--navy); }
    .stat .n small { font-size: 16.5px; color: var(--ink-3); }
    .stat .progress { margin-top: 8px; }
    .chapter-block { margin-top: 28px; scroll-margin-top: 130px; }
    .chapter-block .head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
    .chapter-block .head .th { width: 84px; height: 48px; border-radius: 12px; overflow: hidden; background: #DCE7F3; flex: none; }
    .chapter-block .head .th img { width: 100%; height: 100%; object-fit: cover; }
    .chapter-block .head .lb { font-size: 15px; font-weight: 700; color: var(--accent-ink); }
    .chapter-block .head h2 { font-size: 24px; line-height: 1.2; }
    .chapter-block .head .en { font-size: 16.5px; }
    .chapter-block .head .meta { margin-left: auto; font-size: 16px; color: var(--ink-3); text-align: right; }
    .chapter-block .head .progress { width: 140px; margin-top: 6px; margin-left: auto; background: var(--accent-soft); }
    .lesson-list { display: grid; gap: 8px; }
    .lesson-row { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 11px 16px; color: inherit; border-left: 4px solid var(--accent); border-radius: 16px; }
    a.lesson-row:hover { background: var(--accent-soft); color: inherit; }
    .lesson-row .n { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-family: var(--font-display); font-size: 17px; font-weight: 800; border-radius: 50%; color: var(--accent-ink); background: var(--accent-soft); }
    .lesson-row .t { font-weight: 500; }
    .lesson-row .t .en { display: block; font-size: 16px; }
    .lesson-row .tags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .lesson-row.done .n { background: var(--accent-ink); color: #fff; }
    .lesson-row.soon { opacity: .68; border-left-color: var(--line-strong); }
    .lesson-row.soon .n { background: #EAF1FA; color: var(--ink-3); }
    a.lesson-row.soon:hover { background: #fff; opacity: .9; }
    @media (max-width: 720px) {
      .stat { min-width: 0; width: 100%; }
      .chapter-block .head .meta { margin-left: 0; text-align: left; width: 100%; }
      .chapter-block .head .progress { margin-left: 0; }
      .lesson-row { grid-template-columns: 40px minmax(0, 1fr); padding: 10px 12px; }
      .lesson-row .tags { grid-column: 2; justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <main>
    <div class="wrap">
      <section class="page-hero light reveal in">
        <div style="flex:1;min-width:240px">
          <span class="eyebrow" id="eyebrow"></span>
          <h1 id="h1"></h1>
          <p class="lead" id="lead"></p>
        </div>
        <div class="stat" id="stat"></div>
      </section>
      <div id="chapters"></div>
    </div>
  </main>

  <script src="data/lessons.js"></script>
  <script src="data/terms.js"></script>
  <script src="data/content.js"></script>
  <script src="assets/site.js"></script>
  <script>
    Object.assign(PH.UI, {
      lead: ['Thứ tự bài theo SGK Vật lí 12 – Kết nối tri thức với cuộc sống. Bản mẫu có 4 bài mỗi chương; mỗi bài có tóm tắt lí thuyết, công thức, thuật ngữ song ngữ và câu tự kiểm tra.', 'Lessons follow the Grade 12 Physics textbook (Kết nối tri thức với cuộc sống series). The sample has 4 lessons per chapter, each with a summary, formulas, bilingual terms and a self-check.'],
      doneOf: ['bài mẫu đã học', 'sample lessons done'], labShort: ['thí nghiệm ảo', 'virtual lab']
    });
    PH.mount({ active: 'lessons', title: { vi: 'Bài học', en: 'Lessons' } });
    const IMG = { 1: 'chuong1-vat-li-nhiet', 2: 'chuong2-khi-li-tuong', 3: 'chuong3-tu-truong', 4: 'chuong4-vat-li-hat-nhan' };
    const en = () => PH.lang() === 'en';

    function render() {
      const p = PH.progress(); const sample = PH.sampleLessons();
      const done = sample.filter(l => p.lessons[l.n] && p.lessons[l.n].done).length;
      document.getElementById('eyebrow').textContent = PH.ui('navLessons');
      document.getElementById('h1').textContent = PH.ui('fourChapters', { n: sample.length });
      document.getElementById('lead').textContent = PH.dinh(PH.ui('lead'));
      document.getElementById('stat').innerHTML = `<div class="lb">${PH.uiFmt('done')}</div><div class="n">${done} <small>/ ${sample.length} ${PH.uiFmt('doneOf')}</small></div><div class="progress gold"><i style="width:${sample.length ? Math.round(done / sample.length * 100) : 0}%"></i></div>`;
      document.getElementById('chapters').innerHTML = (PH.CHAPTERS || []).map((ch, i) => {
        const pr = PH.sampleProgress(ch.n);
        const rows = ch.lessons.map(n => {
          const l = PH.lesson(n); if (!l) return '';
          const can = PH.canOpen(n); const st = p.lessons[n] || {};
          const tags = [
            st.done && can ? `<span class="tag green">${PH.icon('check', 'sm')}${PH.uiFmt('done')}</span>` : (can && st.visited ? `<span class="tag navy">${PH.uiFmt('inProgress')}</span>` : ''),
            n === PH.LAB_LESSON ? `<span class="tag acc">${PH.icon('flask', 'sm')}${PH.uiFmt('labShort')}</span>` : '',
            can ? '' : `<span class="tag">${PH.uiFmt('noContent')}</span>`
          ].filter(Boolean).join('');
          const title = en() ? `<span class="vi">${PH.esc(PH.dinh(l.en))}</span>` : PH.L({ vi: l.vi, en: l.en });
          return `<a class="card o lesson-row${st.done && can ? ' done' : ''}${can ? '' : ' soon'}" href="bai.html?n=${n}"><span class="n">${PH.pad2(l.n)}</span><span class="t">${title}</span><span class="tags">${tags}</span></a>`;
        }).join('');
        const img = `assets/img/${IMG[ch.n]}`;
        return `<section class="chapter-block acc-${ch.n} reveal" data-delay="${Math.min(i, 3)}" id="chuong-${ch.n}">
          <div class="head"><span class="th"><img src="${img}-168x96.webp" width="168" height="96" loading="lazy" decoding="async" alt="${PH.uiRaw('ch' + ch.n + 'Alt')}"></span>
            <div><p class="lb">${PH.uiFmt('chapter')} ${PH.roman(ch.n)}</p><h2>${PH.esc(en() ? ch.en : ch.vi)}</h2>${en() ? '' : `<span class="en" lang="en">${PH.esc(ch.en)}</span>`}</div>
            <div class="meta">${PH.uiFmt(pr.done ? 'chDone' : 'chNone', { n: pr.total, d: pr.done })}<div class="progress"><i style="width:${pr.pct}%"></i></div></div></div>
          <div class="lesson-list">${rows}</div></section>`;
      }).join('') || '<div class="empty">—</div>';
      PH.reveal(document.getElementById('chapters'));
    }
    render(); PH.applyHash(); PH.onLang(render); document.addEventListener('ph:progress', render);
    window.addEventListener('hashchange', PH.applyHash);
  </script>
</body>
</html>
