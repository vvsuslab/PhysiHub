<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhysiHub — Vật lí 12 song ngữ Việt – Anh</title>
  <meta name="description" content="Học liệu số song ngữ Việt – Anh cho Vật lí 12 (SGK Kết nối tri thức với cuộc sống): bài học, thuật ngữ có phiên âm, luyện đề theo cấu trúc 2025, trò chơi và thí nghiệm ảo.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="PhysiHub — Vật lí 12 song ngữ Việt – Anh">
  <meta property="og:description" content="Bài học, thuật ngữ có phiên âm, luyện đề theo cấu trúc 2025, trò chơi và thí nghiệm ảo — mỗi nội dung đều có bản tiếng Việt và tiếng Anh.">
  <meta property="og:image" content="https://vvsuslab.github.io/PhysiHub/assets/og-physihub.jpg">
  <meta property="og:url" content="https://vvsuslab.github.io/PhysiHub/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Charis+SIL:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css">
  <link rel="stylesheet" href="assets/lively.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0D47A1">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PhysiHub">
  <style>
    /* Khối mở đầu */
    .hero { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 44px; align-items: center; }
    .hero h1 { white-space: pre-line; font-size: clamp(30px, 3.6vw, 44px); line-height: 1.14; letter-spacing: -.6px; margin-top: 16px; }
    .tiep { display: flex; align-items: center; gap: 14px; margin-top: 26px; padding: 14px 14px 14px 16px; border-radius: 20px; background: var(--orange-soft); border: 1.5px solid var(--orange-line); color: var(--ink); transition: background .25s ease, border-color .25s ease; }
    .tiep:hover { background: #FFEFD9; border-color: var(--orange); color: var(--ink); }
    .tiep:hover .btn { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(245, 124, 0, .35); }
    .tiep .ic { width: 46px; height: 46px; border-radius: 14px; flex: none; display: grid; place-items: center; color: #fff; box-shadow: 0 6px 14px rgba(31, 41, 51, .18); }
    .tiep .txt { flex: 1; min-width: 0; }
    .tiep .lbl { display: block; font-size: 13px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--c1-ink); }
    .tiep .ten { display: block; margin-top: 2px; font-family: var(--font-display); font-size: 18px; font-weight: 800; color: var(--navy); text-wrap: balance; }
    .tiep .dong { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
    .tiep .bar { width: 110px; height: 6px; flex: none; border-radius: 3px; background: #FDE3C4; overflow: hidden; }
    .tiep .bar i { display: block; height: 100%; border-radius: 3px; background: var(--grad-cta); }
    .tiep .phu { font-size: 14px; color: var(--ink-3); }
    .tiep .btn { flex: none; min-height: 46px; padding: 0 20px; }
    .demo.panel.has-label { align-self: center; margin-top: 34px; padding: 34px 16px 14px; }
        .demo-row { display: flex; gap: 12px; width: 100%; text-align: left; padding: 12px 14px; border-radius: 14px; background: #fff; border: 1.5px solid var(--blue-line); color: var(--ink); transition: background .35s ease, border-color .35s ease, box-shadow .35s ease; }
    .demo-row + .demo-row { margin-top: 6px; }
    .demo-row:hover { border-color: var(--sky); }
    .demo-row.on { background: #fff; border-color: var(--orange); box-shadow: 0 0 0 3px rgba(255, 167, 38, .22); }
    .demo-row .so { width: 28px; height: 28px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 15px; font-weight: 800; background: var(--sky); color: #fff; }
    .demo-row.on .so { background: var(--grad-cta); color: var(--ink); }
    .demo-row .nhan { margin: 0 0 3px; font-size: 13.5px; font-weight: 700; color: var(--navy-2); }
    .demo-row.on .nhan { color: var(--c1-ink); }
    .demo-row p { font-size: 15px; line-height: 1.5; color: var(--ink); }
    .demo-row p.en { margin-top: 2px; font-family: var(--font-serif); font-style: italic; color: var(--gold); }
    .demo .ghi { margin: 8px 4px 0; font-size: 13.5px; line-height: 1.5; color: var(--ink-3); }
    .tiep-mob { display: none; }
    .section-head a .short { display: none; }
    #installBox[hidden] { display: none; }

    /* Năm lối vào */
    .loi-vao { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; margin-top: 24px; }
    .lv { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 20px 14px 18px; border-radius: 18px; background: #fff; border: 1.5px solid var(--line); box-shadow: 0 1px 2px rgba(31, 41, 51, .04); color: var(--ink); transition: background .25s ease, border-color .25s ease, transform .25s ease, box-shadow .25s ease; }
    .lv:hover { background: var(--o-nen); border-color: var(--o-vien); transform: translateY(-4px); box-shadow: 0 16px 32px rgba(31, 41, 51, .1); color: var(--ink); }
    .lv .ic { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: #fff; border: 3px solid; box-shadow: 0 6px 16px rgba(13, 71, 161, .14); transition: transform .3s ease; }
    .lv:hover .ic { transform: scale(1.08) rotate(-3deg); }
    .lv .ic svg { width: 30px; height: 30px; }
    .lv .t { display: block; margin-top: 12px; font-size: 17px; font-weight: 700; }
    .lv .t-en { display: none; font-size: 14.5px; }
    [data-lang="bi"] .lv .t-en { display: block; }
    .lv .m { display: block; margin-top: 4px; font-size: 14.5px; line-height: 1.45; color: var(--ink-3); }

    /* Bốn chương */
    .the-chuong { display: block; position: relative; background: #fff; border-radius: 20px; overflow: hidden; border: 1.5px solid var(--line); border-top: 4px solid var(--accent); box-shadow: var(--shadow); color: var(--ink); transition: transform .4s cubic-bezier(.2, .7, .3, 1), box-shadow .4s ease, background .3s ease, border-color .3s ease; }
    .the-chuong:hover { transform: translateY(-6px); background: var(--accent-soft); border-color: var(--accent); box-shadow: var(--shadow-hover); color: var(--ink); }
    .the-chuong .band { display: block; position: relative; aspect-ratio: 840 / 454; overflow: hidden; background: #DCE7F3; }
    .the-chuong .band img { width: 100%; height: 100%; object-fit: cover; transition: transform .9s cubic-bezier(.2, .7, .3, 1); }
    .the-chuong:hover .band img { transform: scale(1.07); }
    .the-chuong .lab { position: absolute; right: 12px; top: 12px; background: #fff; color: var(--accent-ink); box-shadow: 0 4px 12px rgba(0, 0, 0, .15); }
    .the-chuong .body { display: block; position: relative; padding: 0 20px 18px; }
    .the-chuong .nhan, .the-chuong .ten, .the-chuong .ten-en, .the-chuong .progress, .the-chuong .meta { display: block; }
    .the-chuong .icon-tile { margin-top: -24px; border: 3px solid #fff; }
    .the-chuong .nhan { margin: 10px 0 2px; font-size: 13.5px; font-weight: 700; letter-spacing: .4px; color: var(--accent-ink); }
    .the-chuong .ten { font-family: var(--font-display); font-size: 20px; font-weight: 800; transition: color .3s ease; }
    .the-chuong:hover .ten { color: var(--accent-ink); }
    .the-chuong .ten-en { font-size: 16px; margin-top: 1px; }
    .the-chuong .progress { margin-top: 12px; background: var(--accent-soft); }
    .the-chuong .meta { margin-top: 8px; font-size: 14px; color: var(--ink-3); }
    .the-chuong .pill-mob { display: none; }

    @media (max-width: 1080px) {
      .hero { gap: 28px; }
      .loi-vao { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 900px) {
      .hero { grid-template-columns: 1fr; }
      .demo { max-width: 620px; }
      .grid.c4.chuong { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 720px) {
      .hero-panel { padding: 18px; border-radius: 22px; }
      .hero h1 { font-size: 27px; margin-top: 8px; }
      .hero .sub-en { font-size: 16.5px; margin-top: 5px; }
      .hero p.lead, .demo, .tiep.desk { display: none; }
      .tiep-mob { display: block; margin-top: 12px; padding: 12px 14px; border: 1.5px solid transparent; transition: background .25s ease, border-color .25s ease; }
      .tiep-mob:hover { background: var(--orange-soft); border-color: var(--orange-line); }
      .tiep-mob .top { display: flex; align-items: center; gap: 12px; }
      .tiep-mob .ic { width: 40px; height: 40px; border-radius: 12px; flex: none; display: grid; place-items: center; color: #fff; }
      .tiep-mob .lbl { font-size: 13.5px; font-weight: 700; color: var(--accent-ink); }
      .tiep-mob .ten { margin-top: 1px; font-family: var(--font-display); font-size: 17px; font-weight: 800; }
      .tiep-mob .dong { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
      .tiep-mob .progress { flex: 1; background: var(--accent-soft); }
      .tiep-mob .phu { flex: none; font-size: 13.5px; color: var(--ink-3); white-space: nowrap; }
      .tiep-mob .btn { flex: none; min-height: 40px; padding: 0 16px; font-size: 15px; }
      .loi-vao { display: flex; gap: 10px; margin: 14px -16px 0; padding: 4px 16px 8px; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
      .loi-vao::-webkit-scrollbar { display: none; }
      .lv { flex: none; width: 138px; scroll-snap-align: start; padding: 14px 10px 12px; }
      .lv .ic { width: 48px; height: 48px; border-radius: 14px; }
      .lv .ic svg { width: 24px; height: 24px; }
      .lv .t { font-size: 15.5px; margin-top: 8px; }
      .lv .m { font-size: 13.5px; }
      .section-head { flex-direction: row; align-items: baseline; }
      .section-head h2 { font-size: 19px; }
      .section-head a { white-space: nowrap; font-size: 14.5px; flex: none; }
      .section-head a .long { display: none; }
      .grid.c4.chuong { display: flex; flex-direction: column; gap: 8px; }
      .the-chuong { display: flex; align-items: center; gap: 12px; padding: 8px 12px 8px 8px; border-radius: 16px; border-top-width: 1.5px; border-left: 4px solid var(--accent); }
      .the-chuong:hover { transform: none; }
      .the-chuong .band { width: 84px; height: 48px; aspect-ratio: auto; flex: none; border-radius: 10px; }
      .the-chuong .lab { display: none; }
      .the-chuong .body { flex: 1; min-width: 0; padding: 0; }
      .the-chuong .icon-tile, .the-chuong .progress, .the-chuong .meta { display: none; }
      .the-chuong .nhan { margin: 0 0 1px; }
      .the-chuong .ten { font-family: var(--font-sans); font-size: 16.5px; font-weight: 700; }
      .the-chuong .ten-en { font-size: 14px; margin: 0; }
      .the-chuong .pill-mob { display: flex; align-items: center; justify-content: center; flex: none; min-width: 40px; height: 26px; padding: 0 8px; border-radius: 13px; background: var(--accent-soft); color: var(--accent-ink); font-size: 13.5px; font-weight: 700; }
    }
  </style>
</head>
<body>
  <main>
    <div class="wrap">
      <!-- KHỐI MỞ ĐẦU: một nút duy nhất để học tiếp -->
      <section class="hero-panel reveal in">
        <div class="hero">
          <div>
            <span class="eyebrow" id="heroEyebrow"></span>
            <h1 id="heroH1"></h1>
            <p class="sub-en" lang="en" id="heroSub"></p>
            <p class="lead" id="heroLead"></p>
            <a class="tiep desk" id="tiepDesk" href="bai.html?n=1"></a>
          </div>
          <div class="panel has-label demo" id="demo"></div>
        </div>
      </section>

      <!-- Thẻ "học tiếp" cho điện thoại (trên máy tính nằm trong khối mở đầu) -->
      <a class="card tiep-mob" id="tiepMob" href="bai.html?n=1"></a>

      <!-- NĂM LỐI VÀO -->
      <nav class="loi-vao" id="loiVao" aria-label=""></nav>

      <!-- BỐN CHƯƠNG -->
      <section class="section" style="margin-top: 30px">
        <div class="section-head">
          <h2 id="chH2"></h2>
          <a href="baihoc.html" id="chXem"></a>
        </div>
        <div class="grid c4 chuong" id="chuongGrid"></div>
      </section>

      <p class="notice row" id="installBox" hidden style="margin-top: 24px"></p>
    </div>
  </main>

  <script src="data/lessons.js"></script>
  <script src="data/terms.js"></script>
  <script src="data/content.js"></script>
  <script src="data/exams.js"></script>
  <script src="assets/site.js"></script>
  <script>
    PH.mount({ active: 'home', title: { vi: 'Vật lí 12 song ngữ Việt – Anh', en: 'Bilingual Physics 12' } });

    const DEMO = [
      { so: 1, lang: 'vi', key: 'lv1', mo: 'lv1d', vi: 'Ở nhiệt độ không đổi, áp suất (pressure) của một lượng khí xác định tỉ lệ nghịch với thể tích (volume) của nó.', en: '' },
      { so: 2, lang: 'bi', key: 'lv2', mo: 'lv2d', vi: 'Ở nhiệt độ không đổi, áp suất của một lượng khí xác định tỉ lệ nghịch với thể tích của nó.', en: 'At constant temperature, the pressure of a fixed mass of gas is inversely proportional to its volume.' },
      { so: 3, lang: 'en', key: 'lv3', mo: 'lv3d', vi: '', en: 'At constant temperature, the pressure of a fixed mass of gas is inversely proportional to its volume.' }
    ];
    const IMG = { 1: 'chuong1-vat-li-nhiet', 2: 'chuong2-khi-li-tuong', 3: 'chuong3-tu-truong', 4: 'chuong4-vat-li-hat-nhan' };
    const en = () => PH.lang() === 'en';
    const $ = id => document.getElementById(id);

    function renderHero() {
      $('heroEyebrow').textContent = PH.dinh(PH.ui('heroEyebrow'));
      $('heroH1').textContent = PH.ui('heroH1');
      $('heroSub').textContent = PH.ui('heroSub');
      $('heroLead').textContent = PH.dinh(PH.ui('heroLead'));
      const cur = PH.lang();
      $('demo').innerHTML = PH.label('lang', PH.uiFmt('sameSentence'), '', 'sm') + DEMO.map(d => {
        const on = d.lang === cur;
        const body = en() ? `<p>${PH.uiFmt(d.mo)}</p>` : `${d.vi ? `<p>${PH.esc(PH.dinh(d.vi))}</p>` : ''}${d.en ? `<p class="en" lang="en">${PH.esc(PH.dinh(d.en))}</p>` : ''}`;
        return `<button type="button" class="demo-row${on ? ' on' : ''}" data-lang="${d.lang}" aria-pressed="${on}"><span class="so">${d.so}</span><span style="min-width:0"><p class="nhan">${PH.uiFmt(d.key)}${on ? ' · ' + PH.uiFmt('selected') : ''}</p>${body}</span></button>`;
      }).join('') + `<p class="ghi">${PH.uiFmt('sameSentenceHint')}</p>`;
    }
    $('demo').addEventListener('click', e => { const b = e.target.closest('.demo-row'); if (b) PH.setLang(b.dataset.lang); });

    function renderContinue() {
      const nx = PH.nextLesson(); const l = PH.lesson(nx.n) || { n: nx.n, chapter: 1 }; const c = l.chapter;
      const rec = PH.progress().lessons[nx.n] || {};
      const pct = nx.state === 'doing' ? Math.min(99, Math.round(rec.read || 0)) : nx.state === 'done' ? 100 : 0;
      const lbl = nx.state === 'doing' ? PH.ui('inProgressLbl', { c: PH.roman(c) }) : nx.state === 'next' ? PH.ui('nextUp', { c: PH.roman(c) }) : nx.state === 'done' ? PH.ui('allDone', { c: PH.roman(c) }) : PH.ui('startHere');
      const phu = nx.state === 'doing' ? PH.ui('read', { p: pct }) : nx.state === 'done' ? PH.ui('done') : nx.state === 'next' ? PH.ui('notStartedShort') : PH.ui('notStarted');
      const phuNgan = nx.state === 'new' ? PH.ui('notStartedShort') : phu;
      const btn = nx.state === 'new' ? PH.ui('startBtn') : nx.state === 'done' ? PH.ui('reviewAgain') : PH.ui('continueBtn');
      const name = PH.T(PH.lessonTitle(nx.n)).split(' — ')[0];
      const href = `bai.html?n=${nx.n}`;
      const desk = $('tiepDesk'); desk.href = href;
      desk.innerHTML = `<span class="ic tone-${c}">${PH.icon(PH.CH_ICON[c])}</span><span class="txt"><span class="lbl">${PH.esc(lbl)}</span><span class="ten">${PH.esc(PH.dinh(name))}</span><span class="dong"><span class="bar"><i style="width:${pct}%"></i></span><span class="phu">${PH.esc(phu)}</span></span></span><span class="btn gold">${PH.esc(btn)}${PH.icon('arrow', 'sm')}</span>`;
      const mob = $('tiepMob'); mob.href = href; mob.className = `card tiep-mob acc-${c}`;
      mob.innerHTML = `<span class="top"><span class="ic tone-${c}">${PH.icon(PH.CH_ICON[c])}</span><span style="flex:1;min-width:0"><span class="lbl" style="display:block">${PH.esc(lbl)}</span><span class="ten">${PH.esc(PH.dinh(name))}</span></span></span><span class="dong"><span class="progress"><i style="width:${pct}%"></i></span><span class="phu">${PH.esc(phuNgan)}</span><span class="btn gold">${PH.esc(btn)}${PH.icon('arrow', 'sm')}</span></span>`;
    }

    function renderEntries() {
      const nL = PH.sampleLessons().length, nT = (PH.TERMS || []).length;
      const nQ = (PH.EXAMS || []).reduce((s, x) => s + x.parts.reduce((a, p) => a + p.items.length, 0), 0);
      const LOI = [
        { href: 'baihoc.html', icon: 'book', key: 'navLessons', m: 'entryLessons', v: { n: nL }, ring: '#1E88E5', ink: 'var(--navy)', nen: '#EDF5FD', vien: '#90C2F0' },
        { href: 'thuatngu.html', icon: 'speaker', key: 'navTerms', m: 'entryTerms', v: { n: nT }, ring: '#F57C00', ink: '#C25400', nen: '#FFF6EA', vien: '#F6C995' },
        { href: 'luyende.html', icon: 'exam', key: 'navExams', m: 'entryExams', v: { n: nQ }, ring: '#1E88E5', ink: 'var(--navy)', nen: '#EDF5FD', vien: '#90C2F0' },
        { href: 'games.html', icon: 'game', key: 'navGames', m: 'entryGames', ring: '#F57C00', ink: '#C25400', nen: '#FFF6EA', vien: '#F6C995' },
        { href: 'thinghiem.html', icon: 'flask', key: 'navLab', m: 'entryLab', ring: '#1E88E5', ink: 'var(--navy)', nen: '#EDF5FD', vien: '#90C2F0' }
      ];
      const box = $('loiVao'); box.setAttribute('aria-label', PH.ui('todayH2'));
      box.innerHTML = LOI.map(o => `<a class="lv" href="${o.href}" style="--o-nen:${o.nen};--o-vien:${o.vien}"><span class="ic" style="border-color:${o.ring};color:${o.ink}">${PH.icon(o.icon)}</span><span class="t">${PH.uiFmt(o.key)}</span><span class="t-en en" lang="en">${PH.esc(PH.UI[o.key][1])}</span><span class="m">${PH.uiFmt(o.m, o.v)}</span></a>`).join('');
    }

    function renderChapters() {
      const n = PH.sampleLessons().length;
      $('chH2').textContent = PH.ui('fourChapters', { n });
      $('chXem').innerHTML = `<span class="long">${PH.uiFmt('seeAllLessons')}</span><span class="short">${PH.uiFmt('seeAllShort')}</span>` + PH.icon('arrow', 'sm');
      $('chuongGrid').innerHTML = (PH.CHAPTERS || []).map((ch, i) => {
        const pr = PH.sampleProgress(ch.n);
        const meta = pr.done ? PH.ui('chDone', { n: pr.total, d: pr.done }) : PH.ui('chNone', { n: pr.total });
        const hasLab = ch.lessons.includes(PH.LAB_LESSON);
        const img = `assets/img/${IMG[ch.n]}`;
        return `<a class="the-chuong acc-${ch.n} reveal" data-delay="${i}" href="baihoc.html#chuong-${ch.n}">
          <span class="band"><img src="${img}-600x324.webp" srcset="${img}-168x96.webp 168w, ${img}-600x324.webp 600w" sizes="(max-width: 720px) 84px, (max-width: 900px) 45vw, 280px" width="600" height="324" loading="lazy" decoding="async" alt="${PH.uiRaw('ch' + ch.n + 'Alt')}">${hasLab ? `<span class="tag lab">${PH.icon('flask', 'sm')}${PH.uiFmt('lab')}</span>` : ''}</span>
          <span class="body"><span class="icon-tile tone-${ch.n}">${PH.icon(PH.CH_ICON[ch.n])}</span>
            <span class="nhan">${PH.uiFmt('chapter')} ${PH.roman(ch.n)}</span>
            <span class="ten">${PH.esc(en() ? ch.en : ch.vi)}</span>
            ${en() ? '' : `<span class="ten-en en" lang="en">${PH.esc(ch.en)}</span>`}
            <span class="progress"><i style="width:${pr.pct}%"></i></span>
            <span class="meta">${PH.esc(PH.dinh(meta))}</span></span>
          <span class="pill-mob">${pr.done}/${pr.total}</span></a>`;
      }).join('');
      PH.reveal($('chuongGrid'));
    }

    function renderAll() { renderHero(); renderContinue(); renderEntries(); renderChapters(); }
    renderAll();
    PH.onLang(renderAll);
    document.addEventListener('ph:progress', renderContinue);
    document.addEventListener('ph:progress', renderChapters);

    // Nút "Cài lên màn hình chính" chỉ hiện khi trình duyệt cho phép cài ứng dụng web
    const box = $('installBox');
    const showInstall = () => {
      box.hidden = !PH.canInstall();
      if (!box.hidden) box.innerHTML = `<span style="flex:1">${PH.uiFmt('installLater')}</span><button type="button" class="btn sm outline" id="btnInstall">${PH.uiFmt('install')}</button>`;
    };
    showInstall(); document.addEventListener('ph:installable', showInstall); PH.onLang(showInstall);
    box.addEventListener('click', async e => { if (!e.target.closest('#btnInstall')) return; const ok = await PH.install(); PH.toast(PH.ui(ok ? 'installed' : 'installLater')); showInstall(); });
  </script>
</body>
</html>
