<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghép cặp Vật lí — PhysiHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css">
  <link rel="stylesheet" href="assets/lively.css">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2e4a86">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PhysiHub">
  <style>
    .top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
    .top .name { font-family: var(--font-serif); font-size: 22px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    .top .name .mark { width: 24px; height: 24px; border-radius: 7px; background: linear-gradient(90deg, var(--navy) 0 50%, var(--gold) 50% 100%); }
    .top .sep { width: 1px; height: 22px; background: var(--line-strong); }
    .top .scope { font-size: 14px; color: var(--ink-2); }
    .top .exit { margin-left: auto; }
    .layout { display: grid; grid-template-columns: 1fr 280px; gap: 20px; align-items: start; }
    .board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; position: relative; }
    .cardx { aspect-ratio: 4 / 3; perspective: 800px; }
    .cardx .in { position: relative; width: 100%; height: 100%; transition: transform .35s; transform-style: preserve-3d; }
    .cardx.up .in, .cardx.done .in { transform: rotateY(180deg); }
    .face { position: absolute; inset: 0; border-radius: 10px; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 10px; border: 1px solid var(--line-strong); }
    .face.back { color: #fff; font-family: var(--font-serif); font-size: 28px; cursor: pointer; }
    .face.front { background: var(--surface); transform: rotateY(180deg); }
    .face.front .k { font-size: 10px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px; }
    .face.front .t { font-size: 15px; font-weight: 500; line-height: 1.3; word-break: break-word; }
    .face.front .t.math { font-family: var(--font-serif); font-size: 19px; }
    .face.front .t.en { color: var(--gold-2); }
    .cardx.bad .face.front { border-color: var(--red); background: var(--red-soft); }
    .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(255,255,255,.94); backdrop-filter: blur(3px); border-radius: 22px; text-align: center; padding: 24px; z-index: 2; }
    .overlay h2 { color: var(--violet); }
    .overlay h2 { font-size: 30px; }
    .overlay p { color: var(--ink-2); max-width: 460px; }
    .side { display: flex; flex-direction: column; gap: 14px; }
    .stat { padding: 12px 0; border-top: 1px solid var(--line); }
    .stat:first-child { border-top: 0; padding-top: 0; }
    .stat .l { font-size: 13px; color: var(--ink-3); }
    .stat .v { font-family: var(--font-serif); font-size: 30px; color: var(--navy); }
    .stat .v.gold { color: var(--gold); }
    .stat .progress { margin-top: 8px; }
    @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } .board { grid-template-columns: repeat(3, 1fr); } .face.front .t { font-size: 13px; } }
  </style>
</head>
<body>
  <main>
    <div class="wrap">
      <div class="top">
        <div class="name"><span class="mark"></span>Ghép cặp Vật lí</div><span class="sep"></span>
        <span class="scope">Phạm vi: <b id="scopeLabel"></b></span>
        <span class="pill gold" id="langPill"></span>
        <a class="exit" href="games.html">Thoát ván</a>
      </div>
      <div class="layout">
        <div class="board" id="board"></div>
        <aside class="side">
          <div class="card">
            <div class="stat"><div class="l">Thời gian còn lại</div><div class="v gold" id="time">90 giây</div></div>
            <div class="stat"><div class="l">Lượt lật</div><div class="v" id="flips">0</div></div>
            <div class="stat"><div class="l">Đã ghép</div><div class="v" id="matched">0 / 6</div><div class="progress"><i id="bar" style="width:0%"></i></div></div>
            <div class="stat"><div class="l">Kỷ lục của em</div><div class="small" id="best">—</div></div>
          </div>
          <div class="notice">Mỗi cặp là hai mặt của cùng một kiến thức: thuật ngữ Việt – Anh, hoặc công thức – định luật/đơn vị. Lật hai thẻ; ghép đúng thì cặp đó ở lại.</div>
          <button class="btn outline block" id="btnNew" style="color:var(--violet)">Ván mới</button>
        </aside>
      </div>
    </div>
  </main>

  <script src="data/lessons.js"></script>
  <script src="data/terms.js"></script>
  <script src="data/pairs.js"></script>
  <script src="assets/site.js"></script>
  <script>
    PH.mount({ active: 'games', noFooter: true });
    const ROUND = 90, PAIRS_PER_GAME = 6;
    const board = document.getElementById('board');
    const scope = PH.scope();
    document.getElementById('scopeLabel').textContent = PH.scopeLabel(scope);
    const langPill = () => { const l = PH.langInfo(); document.getElementById('langPill').textContent = `Mức ${l.long} · điểm ×${PH.num(l.mult)}`; };
    langPill(); PH.onLang(langPill);

    let cards = [], open = [], lock = false, flips = 0, matched = 0, timer = null, endAt = 0, startedAt = 0, running = false;

    function buildPairs() {
      const terms = PH.scopeTerms(scope);
      const chapters = new Set(terms.map(t => t.chapter));
      let formula = (PH.PAIRS || []).filter(p => scope.type === 'all' || chapters.has(p.chapter));
      if (scope.type === 'lesson' || scope.type === 'weak') formula = [];
      const fPick = PH.sample(formula, Math.min(3, formula.length));
      const tPick = PH.sample(terms, Math.max(0, PAIRS_PER_GAME - fPick.length));
      let pairs = fPick.map(p => ({ id: p.id, a: { k: p.a.kind, t: p.a.title, math: true }, b: { k: p.b.kind, t: p.b.title, math: false } }))
        .concat(tPick.map(t => ({ id: t.id, a: { k: 'thuật ngữ', t: t.vi }, b: { k: 'term', t: t.en, en: true } })));
      if (pairs.length < PAIRS_PER_GAME) { // thiếu thì bù từ toàn bộ ngân hàng
        const used = new Set(pairs.map(p => p.id));
        PH.shuffle((PH.TERMS || []).filter(t => !used.has(t.id))).slice(0, PAIRS_PER_GAME - pairs.length).forEach(t => pairs.push({ id: t.id, a: { k: 'thuật ngữ', t: t.vi }, b: { k: 'term', t: t.en, en: true } }));
      }
      return pairs;
    }

    function start() {
      const pairs = buildPairs();
      cards = PH.shuffle(pairs.flatMap(p => [{ pid: p.id, ...p.a }, { pid: p.id, ...p.b }]));
      open = []; lock = false; flips = 0; matched = 0; running = true; startedAt = Date.now(); endAt = startedAt + ROUND * 1000;
      board.innerHTML = cards.map((c, i) => `<div class="cardx" data-i="${i}"><div class="in"><div class="face back">?</div><div class="face front"><span class="k">${PH.esc(c.k)}</span><span class="t ${c.math ? 'math' : ''} ${c.en ? 'en' : ''}">${PH.esc(c.t)}</span></div></div></div>`).join('');
      clearInterval(timer); timer = setInterval(tick, 250); tick(); renderStats();
    }
    function tick() {
      if (!running) return;
      const left = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
      document.getElementById('time').textContent = left + ' giây';
      if (left === 0) finish(false);
    }
    function renderStats() {
      document.getElementById('flips').textContent = flips;
      document.getElementById('matched').textContent = `${matched} / ${PAIRS_PER_GAME}`;
      document.getElementById('bar').style.width = (matched / PAIRS_PER_GAME * 100) + '%';
      const b = PH.progress().games.match || {};
      document.getElementById('best').textContent = b.bestFlips ? `${b.bestFlips} lượt lật · ${PH.mmss(b.bestTime || 0)}` : 'Chưa có — hoàn thành một ván để lập kỷ lục.';
    }
    function finish(won) {
      running = false; clearInterval(timer);
      const time = Math.round((Date.now() - startedAt) / 1000);
      const prev = PH.progress().games.match || {};
      PH.logGame('match', { won, flips, time: won ? time : null, matched });
      const record = won && (!prev.bestFlips || flips < prev.bestFlips);
      const ov = document.createElement('div'); ov.className = 'overlay';
      ov.innerHTML = won
        ? `<h2>Xong bảng!</h2><p>${flips} lượt lật · ${PH.mmss(time)}${record ? ' · <b style="color:var(--gold-2)">Kỷ lục mới!</b>' : ''}</p><div class="row"><button class="btn" id="btnAgain">Ván mới</button><a class="btn outline" href="games.html">Về Trò chơi</a></div>`
        : `<h2>Hết giờ</h2><p>Em đã ghép ${matched}/${PAIRS_PER_GAME} cặp. Thử lại nhé — các thẻ sẽ được xáo lại.</p><div class="row"><button class="btn" id="btnAgain">Chơi lại</button><a class="btn outline" href="games.html">Về Trò chơi</a></div>`;
      board.appendChild(ov); renderStats();
      if (won) confetti();
      document.getElementById('btnAgain').addEventListener('click', start);
    }
    // Mưa giấy màu khi ghép xong bảng
    function confetti() {
      const box = document.createElement('div'); box.className = 'confetti';
      const colors = ['#2e4a86', '#a9782a', '#e0663f', '#178a8f', '#6a5acd', '#3d9a5c'];
      for (let i = 0; i < 48; i++) {
        const s = document.createElement('span');
        s.style.left = Math.random() * 100 + '%'; s.style.background = colors[i % colors.length];
        s.style.animationDelay = (Math.random() * .9) + 's'; s.style.animationDuration = (1.4 + Math.random() * .8) + 's';
        box.appendChild(s);
      }
      board.appendChild(box); setTimeout(() => box.remove(), 3000);
    }

    board.addEventListener('click', e => {
      const el = e.target.closest('.cardx'); if (!el || !running || lock) return;
      if (el.classList.contains('up') || el.classList.contains('done')) return;
      el.classList.add('up'); open.push(el); flips++; renderStats();
      if (open.length === 2) {
        lock = true;
        const [a, b] = open; const ca = cards[+a.dataset.i], cb = cards[+b.dataset.i];
        if (ca.pid === cb.pid) {
          setTimeout(() => { a.classList.add('done'); b.classList.add('done'); a.classList.remove('up'); b.classList.remove('up'); open = []; lock = false; matched++; renderStats(); if (matched === PAIRS_PER_GAME) finish(true); }, 350);
        } else {
          a.classList.add('bad'); b.classList.add('bad');
          setTimeout(() => { a.classList.remove('up', 'bad'); b.classList.remove('up', 'bad'); open = []; lock = false; }, 900);
        }
      }
    });
    document.getElementById('btnNew').addEventListener('click', start);

    (function intro() {
      board.innerHTML = Array.from({ length: 12 }, () => '<div class="cardx"><div class="in"><div class="face back">?</div></div></div>').join('');
      const ov = document.createElement('div'); ov.className = 'overlay';
      ov.innerHTML = `<h2>Ghép cặp Vật lí</h2><p>12 thẻ · 6 cặp · 90 giây. Lật hai thẻ một lượt và ghép đúng cặp với số lượt lật ít nhất.</p><button class="btn" id="btnStart">Bắt đầu</button>`;
      board.appendChild(ov); renderStats();
      document.getElementById('btnStart').addEventListener('click', start);
    })();
  </script>
</body>
</html>
